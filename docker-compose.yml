x-backend: &backend
  image: saarthixcrm-backend
  pull_policy: never
  expose:
    - "8082"
  environment: &backend-env
    MONGODB_URI: mongodb://mongo:27017/saarthix_crm
    SPRING_MAIL_HOST: mailpit
    SPRING_MAIL_PORT: 1025
    SPRING_MAIL_AUTH: "false"
    SPRING_MAIL_STARTTLS: "false"
    APP_MAIL_FROM: crm@saarthix.local
    APP_MAIL_FROM_NAME: SaarthiX CRM
    APP_MAIL_INBOX_URL: http://localhost:8025
    APP_SCHEDULING_ENABLED: "false"
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8082/api/health"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 60s
  restart: unless-stopped

services:
  mongo:
    image: mongo:7
    volumes:
      - saarthix_crm_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"

  # Instance 1 also runs the scheduled reminder jobs and the startup seed/migrations first.
  backend:
    <<: *backend
    build: ./backend
    pull_policy: build
    environment:
      <<: *backend-env
      APP_SCHEDULING_ENABLED: "true"
    depends_on:
      mongo:
        condition: service_healthy
      mailpit:
        condition: service_started

  backend-2:
    <<: *backend
    depends_on:
      backend:
        condition: service_healthy

  backend-3:
    <<: *backend
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build: ./frontend
    expose:
      - "80"
    depends_on:
      - backend
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "5175:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/gateway/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped

volumes:
  saarthix_crm_data:
