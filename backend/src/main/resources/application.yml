server:
  port: 8082

spring:
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/saarthix_crm}
      auto-index-creation: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${SPRING_MAIL_AUTH:false}
      mail.smtp.starttls.enable: ${SPRING_MAIL_STARTTLS:false}

app:
  jwt:
    secret: ${JWT_SECRET:saarthix-crm-dev-secret-key-change-in-production-32b}
    expiration-ms: 86400000
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5175,http://127.0.0.1:5175}
  mail:
    from: ${APP_MAIL_FROM:}
    from-name: ${APP_MAIL_FROM_NAME:SaarthiX CRM}
    inbox-url: ${APP_MAIL_INBOX_URL:}
  reminders:
    cron: ${APP_REMINDERS_CRON:0 0 8 * * *}
