# SaarthiX CRM API gateway: the only publicly exposed service.
#   /api/*  -> load balanced across the backend instances
#   /*      -> frontend (static React build)

# Docker's embedded DNS. Re-resolving service names keeps working when a container restarts with a new IP.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream saarthix_backend {
    zone saarthix_backend 64k;
    # Round robin. A server that fails 3 times is skipped for 10s (passive health check).
    server backend:8082   resolve max_fails=3 fail_timeout=10s;
    server backend-2:8082 resolve max_fails=3 fail_timeout=10s;
    server backend-3:8082 resolve max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream saarthix_frontend {
    zone saarthix_frontend 64k;
    server frontend:80 resolve;
    keepalive 8;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    location = /gateway/health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://saarthix_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        # Retry on another instance only when it failed before handling the request; POST/PATCH are never replayed.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        add_header X-Upstream $upstream_addr always;
    }

    location / {
        proxy_pass http://saarthix_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
